apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: app
  name: app
  namespace: covenant
spec:
  replicas: 1
  # Never overlap old password writers with the credential-revision-aware server (V20).
  # This single-instance deployment accepts brief downtime during application upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      labels:
        io.kompose.service: app
    spec:
      # The same hardening as the checker pod: the image runs as uid 10001 (Dockerfile), the root
      # filesystem is read-only (the JVM only needs a writable /tmp), no privilege escalation.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            # Secrets come from the `covenant-secrets` Secret — see k8s/secret.yaml for how to
            # create it (never commit real values). The app fail-closes on placeholder/burned
            # JWT secrets and on unrotated seed passwords, so a misconfigured deploy crash-loops
            # instead of running with a backdoor.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: covenant-secrets
                  key: JWT_SECRET
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: covenant-secrets
                  key: DATA_ENCRYPTION_KEY
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: covenant-secrets
                  key: ADMIN_INITIAL_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: covenant-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: covenant-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_JDBC_URL
              value: jdbc:postgresql://postgres:5432/covenant
            - name: POSTGRES_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/covenant
            # The checker sidecar (k8s/checker-*.yaml): lint/semantic findings ride the JVM's
            # own syntax/schema verdicts; unreachable = a CHECKER_UNAVAILABLE finding, never a
            # failed request. The shared token is the second fence behind the NetworkPolicy.
            - name: CHECKER_URL
              value: http://checker:9090
            - name: CHECKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: covenant-secrets
                  key: CHECKER_TOKEN
                  optional: true
            # Production posture (the image default). For throwaway local-cluster testing over
            # plain HTTP (no TLS ingress), set this to "true" — HTTPS redirect / HSTS turn off
            # and the seed credentials are tolerated, exactly like the compose demo.
            - name: KTOR_DEVELOPMENT
              value: "false"
            # The app sits behind an ingress / LB that must terminate TLS and set
            # canonical X-Forwarded-Host + X-Forwarded-Proto (overwrite client-supplied values),
            # and append the actual client to X-Forwarded-For. Restrict direct app access and set
            # HTTP_PROXY_HOPS to the trusted chain length so client-IP selection matches it.
            - name: HTTP_BEHIND_PROXY
              value: "true"
            # One ingress/LB hop sits between the client and this pod. Increase only when the
            # deployment adds another trusted proxy that appends to X-Forwarded-For.
            - name: HTTP_PROXY_HOPS
              value: "1"
            # Password reset and email MFA need outbound mail. This deployment ships with
            # mail disabled — set "smtp" plus real SMTP_HOST/MAIL_FROM/MAIL_APP_URL to enable
            # those flows (production refuses the `log` transport).
            # SMTP credentials come from the Secret.
            - name: MAIL_TRANSPORT
              value: "disabled"
            - name: SMTP_HOST
              value: ""
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_STARTTLS
              value: "true"
            - name: MAIL_FROM
              value: "covenant@localhost"
            - name: MAIL_APP_URL
              value: ""
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: covenant-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: covenant-secrets
                  key: SMTP_PASSWORD
                  optional: true
          # Local render placeholder. apply-local.sh substitutes an immutable per-build tag
          # before kubectl sees the manifest; OrbStack shares Docker's image store.
          image: covenant-app:local-build
          imagePullPolicy: IfNotPresent
          name: covenant-app
          ports:
            - containerPort: 8082
              protocol: TCP
          # Sized for the tuned JVM baked into the image (SerialGC + -Xmx256m + C1): ~270 MiB RSS
          # under light load. Request covers steady state; the 512 MiB limit bounds it with headroom.
          resources:
            requests:
              cpu: "250m"
              memory: "320Mi"
            limits:
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /api/v1/ready round-trips the database (SELECT 1) — the pod leaves the Service while
          # postgres is unreachable; /api/v1/health only proves the process answers. The
          # startupProbe gives JVM boot + Flyway migrations up to ~150s (30 x 5s) before the
          # liveness clock starts. Every probe keeps the canonical HTTPS header used by the
          # ingress contract; the status-only probe routes also work for direct image checks when
          # proxy trust is disabled.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8082
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8082
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            # The handler may spend up to three seconds waiting for the database/pool. Give that
            # budget room to answer, and tolerate brief saturation without flapping the pod.
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8082
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
