apiVersion: apps/v1
kind: Deployment
metadata:
  name: checker
  namespace: covenant
  labels:
    io.kompose.service: checker
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: checker
  template:
    metadata:
      labels:
        io.kompose.service: checker
    spec:
      # The image runs as the node image's `node` user (checker/Dockerfile). The uid must be
      # spelled out here: with only runAsNonRoot the kubelet refuses a by-name USER it cannot
      # verify ("image has non-numeric user") — the app pod pins its 10001 the same way.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: covenant-checker
          # Built locally with `docker build -t covenant-checker:latest -f checker/Dockerfile .`;
          # OrbStack's Kubernetes shares the Docker image store (see app-deployment.yaml).
          image: covenant-checker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "9090"
            - name: CHECKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: covenant-secrets
                  key: CHECKER_TOKEN
                  optional: true
          ports:
            - containerPort: 9090
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 15
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
