apiVersion: v1
kind: Service
metadata:
  name: checker
  namespace: covenant
  labels:
    io.kompose.service: checker
spec:
  # ClusterIP only — the checker is never exposed outside the cluster; the app reaches it
  # at http://checker:9090 (CHECKER_URL in app-deployment.yaml).
  type: ClusterIP
  ports:
    - name: "9090"
      port: 9090
      targetPort: 9090
  selector:
    io.kompose.service: checker
