  /api/v1/environments:
    get:
      tags: [environments]
      operationId: listEnvironments
      summary: List environments
      description: |
        Any authenticated user — the try-it feature's target picker reads them; every mutation
        below is ADMIN only. Responses never carry a password (`hasPassword` says whether one is
        stored). Sortable: `id`, `name`, `systemId`, `createdAt`, `updatedAt`. Filters: `name`
        (case- and accent-insensitive substring), `systemId`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: systemId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
      responses:
        '200':
          description: A page of environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [environments]
      operationId: createEnvironment
      summary: Create an environment
      description: |
        ADMIN only (guarded before the body decodes). At least one target (`httpBaseUrl`, `kafka`,
        `postgres`) is required. Static shape rules only — an absolute http(s) base URL without
        credentials, query or fragment (link-local hosts refused); 1–20 `host:port` bootstrap
        servers; a SASL protocol needs a mechanism, a username and a password; a JDBC URL
        starting with `jdbc:postgresql://` whose parameters are limited to `ssl`, `sslmode`,
        `currentSchema`, `ApplicationName`. `systemId` must be an active system (`400`); a
        case-insensitive name clash with an active environment IN THE SAME SYSTEM is `409`.
        Passwords are encrypted at rest and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentRequest'
      responses:
        '201':
          description: Created; `Location` points at the new environment
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/environments/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [environments]
      operationId: getEnvironment
      summary: Fetch an environment
      description: Any authenticated user. Never carries a password.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [environments]
      operationId: updateEnvironment
      summary: Replace an environment
      description: |
        ADMIN only (guard before the id lookup). A full replace of every non-secret field; a
        target whose `password` is absent keeps the stored one, a target omitted altogether is
        removed with its credentials. The same shape rules and the `409` as on create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentRequest'
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [environments]
      operationId: deleteEnvironment
      summary: Delete an environment
      description: ADMIN only. Soft delete; deleting a SYSTEM deletes its environments too.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts:
    get:
      tags: [contracts]
      operationId: listContracts
      summary: List contracts
      description: |
        Any authenticated user. Every row carries `canWrite`, the server's verdict of the writer
        rule for the caller (owning team member, owning user, or ADMIN).

        - Sortable fields: `id`, `name`, `type`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `domainId`, `systemId`, `ownerTeamId`, `ownerUserId` (equality); `type` and
          `lifecycle` (of the LATEST version) are repeatable any-of params; `q` matches name OR
          description case- and accent-insensitively; `hasErrors` (strict boolean) selects
          contracts whose latest version has blocking findings (or none).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/ContractDomainId'
        - $ref: '#/components/parameters/ContractSystemId'
        - $ref: '#/components/parameters/ContractType'
        - $ref: '#/components/parameters/ContractOwnerTeamId'
        - $ref: '#/components/parameters/ContractOwnerUserId'
        - $ref: '#/components/parameters/ContractLifecycle'
        - $ref: '#/components/parameters/ContractQuery'
        - $ref: '#/components/parameters/ContractHasErrors'
      responses:
        '200':
          description: A page of contracts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [contracts]
      operationId: createContract
      summary: Create a contract (no version yet)
      description: |
        Any authenticated user may create a contract they can own: the owner is themselves or a
        team they belong to (ADMIN assigns anyone) — `403` otherwise. Exactly one of
        `ownerTeamId`/`ownerUserId`; the system must be active (`400`); a case-insensitive name
        clash within the system is `409`. Type and system are immutable afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCreateRequest'
      responses:
        '201':
          description: Created; `Location` points at the new contract
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/facets:
    get:
      tags: [contracts]
      operationId: getContractFacets
      summary: Facet counts for the contracts filters
      description: |
        Any authenticated user. The SAME filter parameters as the list and the tree. Classic
        faceting: each dimension is counted with every OTHER filter applied and its own dimension
        lifted, so a count says what picking that value would yield. `lifecycle` counts the latest
        version's state, with `NONE` for contracts that have no version yet; `hasErrors` splits the
        matching contracts into those whose latest version has errors and the rest.
      parameters:
        - $ref: '#/components/parameters/ContractType'
        - $ref: '#/components/parameters/ContractLifecycle'
        - $ref: '#/components/parameters/ContractQuery'
        - $ref: '#/components/parameters/ContractOwnerTeamId'
        - $ref: '#/components/parameters/ContractOwnerUserId'
      responses:
        '200':
          description: The facet counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacetsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/tree:
    get:
      tags: [contracts]
      operationId: getContractTree
      summary: The Domain → System → Contract hierarchy
      description: |
        Any authenticated user. Unpaged — the registries are ADMIN-curated and small; the contract
        level honours the list's `type`, `lifecycle` and `q` filters, and a domain or system with
        no matching contract still appears (the spine never hides a container).
      parameters:
        - $ref: '#/components/parameters/ContractType'
        - $ref: '#/components/parameters/ContractLifecycle'
        - $ref: '#/components/parameters/ContractQuery'
        - $ref: '#/components/parameters/ContractOwnerTeamId'
        - $ref: '#/components/parameters/ContractOwnerUserId'
      responses:
        '200':
          description: The tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/versions/check:
    post:
      tags: [contract-versions]
      operationId: checkDocument
      summary: Live-check a document without storing it
      description: |
        Any authenticated user. The same pipeline every store path runs — syntax → type gate →
        schema/semantic (JVM) → lint/semantic (the checker sidecar) → breaking changes →
        cross-checks — returned as findings-so-far: a broken document is a `200` whose report
        carries the HARD finding, never a `400`. Pass `version` to get the declared-version
        cross-check; pass `contractId` too and the document is compared against that contract's
        highest ACTIVE version below `version` (the report's `baselineVersion`): each breaking
        change is a `BREAKING` finding — INFO once `version` carries the MAJOR bump, otherwise
        WARN plus one soft ERROR `BREAKING_WITHOUT_MAJOR_BUMP`. Nothing stored, no audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCheckRequest'
      responses:
        '200':
          description: The check report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/import:
    post:
      tags: [contract-versions]
      operationId: importContracts
      summary: Import documents as new versions (report & skip)
      description: |
        Any authenticated user, at most 20 items. Each item is one document landing as a new
        version of a contract that may or may not exist yet — a new contract needs an assignable
        owner, an existing one must match the item's type and be writable by the caller. Import
        ALWAYS waives soft findings (`*_WITH_FINDINGS`); only HARD findings, the SemVer rules, a
        type mismatch and the writer rule skip an item. Nothing rethrows: the rows ARE the outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: One result row per item, in order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/import/check:
    post:
      tags: [contract-versions]
      operationId: checkImport
      summary: The import's dry run
      description: The identical per-item classification with nothing stored — `contractId` is set only for existing contracts, `versionId` never.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: The predicted rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/fetch:
    post:
      tags: [contract-versions]
      operationId: fetchDocumentUrl
      summary: Fetch a document from a public https URL (SSRF-guarded)
      description: |
        Any authenticated user. The server issues the outbound GET on the caller's behalf — https
        only, no userinfo, every resolved address public (loopback/private/link-local/CGNAT/NAT64
        refused), no redirects, 1 MiB cap. A guard rejection is the uniform `400`; an upstream
        failure (non-200, redirect, oversize, unreachable) is `502`. GitHub/GitLab blob links are
        rewritten to raw by the SPA before calling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchUrlRequest'
      responses:
        '200':
          description: The fetched text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchUrlResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/v1/contracts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [contracts]
      operationId: getContract
      summary: Get a contract
      description: Any authenticated user; `canWrite` is computed for the caller.
      responses:
        '200':
          description: The contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [contracts]
      operationId: updateContract
      summary: Rename / re-describe a contract
      description: Writers only (owning team member, owning user, ADMIN — checked before the body decodes). Type and system are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUpdateRequest'
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [contracts]
      operationId: deleteContract
      summary: Delete a contract (soft, with its versions)
      description: Writers only. Refused with `409` while any version is ACTIVE or DEPRECATED — retire them first.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/owner:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [contracts]
      operationId: transferContractOwner
      summary: Transfer ownership (ADMIN)
      description: ADMIN only. Exactly one of `ownerTeamId`/`ownerUserId`, an active team/user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerUpdateRequest'
      responses:
        '204':
          description: Transferred
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/export:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [contracts]
      operationId: exportContract
      summary: The contract with every version's verbatim document
      description: Any authenticated user. Versions highest first; each carries its lifecycle, format and raw text — the round trip's outbound half.
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractExportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [contracts]
      operationId: listContractEvents
      summary: The contract's structural change history
      description: |
        Any authenticated user (whoever reads a contract reads its history). Paged, newest first
        (`-timestamp,-id`); sortable on `timestamp`/`id` only. Events are structural — type plus
        a params map the SPA localizes (`version`, `from`/`to`, `owner.from`/`owner.to`, `name`) —
        never document text.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractEventPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [contract-versions]
      operationId: listContractVersions
      summary: List a contract's versions (no content)
      description: |
        Any authenticated user. Default sort `-version` (highest SemVer first — `version` sorts by
        the parsed triple, a release above its prereleases); also `id`, `lifecycle`, `createdAt`,
        `updatedAt`. `lifecycle` is a repeatable any-of filter.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/ContractLifecycle'
      responses:
        '200':
          description: A page of versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [contract-versions]
      operationId: createContractVersion
      summary: Add a DRAFT version
      description: |
        Writers only. `version` must be SemVer 2.0, unique on the contract (`409`) and greater
        than every existing version (`400`). The document must pass the HARD gate — parseable,
        the contract's standard (`400`, never waivable); a SOFT `ERROR` finding blocks unless
        `allowInvalid=true` (the editor's Save-anyway; the findings are re-obtainable through
        `POST /contracts/versions/check`). The check report is stored with the text; the
        response carries content and findings. Documents above 2 MiB are `413`.
      parameters:
        - $ref: '#/components/parameters/AllowInvalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCreateRequest'
      responses:
        '201':
          description: Created; `Location` points at the new version
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [contract-versions]
      operationId: getContractVersion
      summary: Get a version with its document and findings
      responses:
        '200':
          description: The version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [contract-versions]
      operationId: deleteContractVersion
      summary: Delete a DRAFT version
      description: Writers only; only a DRAFT may be deleted (`409` otherwise). The contract's latest pointer is recomputed.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}/content:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [contract-versions]
      operationId: getContractVersionContent
      summary: The raw document text
      description: |
        Any authenticated user. `application/yaml` or `application/json` by the stored format;
        `download=true` adds `Content-Disposition: attachment` with a `<system>__<contract>__<version>.<ext>` filename.
      parameters:
        - name: download
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The document, byte-exact
          content:
            application/yaml:
              schema: { type: string }
            application/json:
              # The stored JSON document itself — any shape.
              schema: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [contract-versions]
      operationId: updateContractVersionContent
      summary: Replace the document of a DRAFT/PROPOSED version
      description: Writers only. `409` from ACTIVE on (the document is read-only — add a version). The same HARD/SOFT gate and `allowInvalid` waiver as create; answers the fresh version (the findings are the product of the save).
      parameters:
        - $ref: '#/components/parameters/AllowInvalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionContentRequest'
      responses:
        '200':
          description: The updated version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}/transition:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [contract-versions]
      operationId: transitionContractVersion
      summary: Move the version along its lifecycle
      description: |
        Writers only. DRAFT → PROPOSED, PROPOSED → DRAFT | ACTIVE, ACTIVE → DEPRECATED,
        DEPRECATED → RETIRED; anything else is `409`. Several ACTIVE versions may coexist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: The version after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}/recheck:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [contract-versions]
      operationId: recheckContractVersion
      summary: Re-run the checks on the stored document
      description: Writers only — the recovery after a checker outage (`checkComplete = false`). Stores the fresh report; the text is untouched.
      responses:
        '200':
          description: The version with the fresh report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}/source:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    put:
      tags: [contract-versions]
      operationId: updateContractVersionSource
      summary: Set or clear the version's repo reference
      description: |
        Writers only, any lifecycle (a reference is metadata, not text). Nothing is fetched. A
        CHANGED reference resets the sync state (`lastSyncedAt = 0`, no baseline) and never bumps
        `updatedAt`; an unchanged value is a silent 204. Static guards only: absolute https, no
        credentials, at most 2048 characters (`400`) — the public-host check runs at fetch time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionSourceRequest'
      responses:
        '204': { description: Reference stored }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}/sync:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [contract-versions]
      operationId: getContractVersionSyncState
      summary: The version's sync state
      description: Any authenticated user. The reference, the last sync stamp and the baseline text the SPA attributes a difference with (Covenant vs the repo).
      responses:
        '200':
          description: The sync state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [contract-versions]
      operationId: syncContractVersion
      summary: Replace the document with the repo copy and stamp the sync
      description: |
        Writers only. The client fetched the reference through `POST /contracts/fetch` and
        confirmed the diff; the server runs the whole check pipeline on the repo copy, ALWAYS
        waives soft findings (the import posture — the repo is the source of truth; HARD findings
        stay a `400`), stores the text and stamps `lastSyncedAt = updatedAt` with the text as the
        new baseline. `409` when the lifecycle locks the text, `400` when the version has no
        reference. Recorded in the history even when the copy matched: pulling it is the act.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: The synced version with its fresh report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/subscription:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [contracts]
      operationId: subscribeContract
      summary: Follow the contract
      description: |
        Any authenticated user — whoever may read a contract may follow it. Idempotent. From then
        on every event on the contract (versions created, edited, published, synced, deleted; the
        owner changed; the contract deleted; a version stored with a waived breaking change) is an
        in-app notification for the follower — never for the actor themselves.
      responses:
        '204': { description: Following }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [contracts]
      operationId: unsubscribeContract
      summary: Stop following the contract
      description: Any authenticated user; `404` when the caller was not following.
      responses:
        '204': { description: No longer following }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List the caller's notifications
      description: |
        Lists notifications addressed to the calling user (`recipientId` = caller). The list is
        always scoped to the caller, ADMIN included — there is no cross-user view. Notifications
        are minted as a side-effect of contract events for the contract's followers; there is no
        create endpoint. Sortable fields: `id`, `timestamp` (default `-timestamp`, newest first;
        `id` ascending appended as the tiebreaker). Filter `wasSeen` — `true`/`false`. The SPA's
        badge is the `total` of a `pageSize=1&wasSeen=false` query.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: wasSeen
          in: query
          required: false
          schema: { type: boolean }
          description: Restrict to seen (`true`) or unseen (`false`) notifications.
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [notifications]
      operationId: getNotification
      summary: Fetch a notification
      description: Recipient-only (ADMIN included) — a missing row is `404`, another user's `403`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [notifications]
      operationId: deleteNotification
      summary: Delete a notification
      description: Recipient-only. Soft-deletes the row; it disappears from every read.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/{id}/seen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [notifications]
      operationId: markNotificationSeen
      summary: Mark a notification as seen
      description: Sets `wasSeen` to `true`. Idempotent. Recipient-only.
      responses:
        '204': { description: Marked as seen }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/{id}/unseen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [notifications]
      operationId: markNotificationUnseen
      summary: Mark a notification as unseen
      description: Sets `wasSeen` to `false`. Idempotent. Recipient-only.
      responses:
        '204': { description: Marked as unseen }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/seen-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsSeen
      summary: Mark all of the caller's notifications as seen
      description: |
        Sets `wasSeen` to `true` for every one of the caller's still-unseen notifications in one
        request. Idempotent and intrinsically caller-scoped (no `{id}`). Deliberately asymmetric:
        un-seeing is a per-notification action.
      responses:
        '204': { description: All of the caller's notifications marked as seen }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}/try:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [try-it]
      operationId: getTryCatalog
      summary: What the version's document offers to try
      description: |
        Any authenticated user. Derived from the stored document — the SPA parses no YAML: the
        OpenAPI operations (path templates, parameters with path-level ones merged in, request-body
        media types, declared response keys, the header names the security schemes expect), the
        AsyncAPI channels (address, verbs, messages with their payload-schema pointers) or the ODCS
        datasets (properties with logical/physical types). The family object matching the contract's
        type is filled; the others stay empty. A stored document that no longer parses offers nothing.
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TryCatalogResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}/try/http:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [try-it]
      operationId: tryHttp
      summary: Send one request to an OpenAPI operation through an environment
      description: |
        Any authenticated user. The environment's HTTP base URL replaces the document's `servers[]`;
        the document contributes the method and the path template (an operation it declares — TRACE
        is never offered; a path must equal a declared template, every `{param}` bound from
        `pathParams`). The server sends the request (redirects are never followed — a 3xx is the
        observation; request and response bodies bounded at 1 MiB, the response body shown truncated
        beyond it), strips cookies and hop-by-hop headers both ways, and refuses the caller's
        `Host`/`Content-Length`/`Cookie`/`Proxy-*`-class headers (`400`). The caller MAY type
        credentials into `headers` — they are forwarded, never stored, logged or audited. Whatever the
        target answers is a `200` here with the status shown; a target that cannot be reached is a
        `502`. The `conformance` report measures the request body before sending (warnings) and the
        response — status, media type, declared headers, body against the response schema — as
        `CONFORMANCE` findings, never stored. Rate-limited per client host (`429`). Audited as
        `contract.tried_http` with the host, method, path template, status and duration only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TryHttpRequest'
      responses:
        '200':
          description: The observation and its conformance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TryHttpResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400.
      schema: { type: integer, format: int32, minimum: 0 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
    VersionId:
      name: vid
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 0 }
    AllowInvalid:
      name: allowInvalid
      in: query
      required: false
      schema: { type: boolean }
      description: Store despite SOFT `ERROR` findings (the Save-anyway waiver). HARD findings are never waivable.
    ContractDomainId:
      name: domainId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
    ContractSystemId:
      name: systemId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
    ContractOwnerTeamId:
      name: ownerTeamId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
    ContractOwnerUserId:
      name: ownerUserId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
    ContractType:
      name: type
      in: query
      required: false
      description: Repeatable — any-of over the contract types.
      schema:
        type: array
        items: { $ref: '#/components/schemas/ContractType' }
      style: form
      explode: true
    ContractLifecycle:
      name: lifecycle
      in: query
      required: false
      description: Repeatable — any-of over lifecycles (the LATEST version's on the contracts list/tree).
      schema:
        type: array
        items: { $ref: '#/components/schemas/Lifecycle' }
      style: form
      explode: true
    ContractQuery:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: Case- and accent-insensitive substring over name OR description.
    ContractHasErrors:
      name: hasErrors
      in: query
      required: false
      schema: { type: boolean }
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail) or, on
        /login, the per-account lockout is active (account-specific detail). Both carry a
        ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling — a memory-DoS backstop shared by
        every endpoint (declared here on the largest-bodied operation; field-level maxLength
        rules reject oversized values far earlier on ordinary payloads).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadGateway:
      description: >-
        The upstream request made on the caller's behalf failed (the remote answered non-200,
        redirected, timed out, or exceeded the size cap).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V18) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        memberIds:
          type: array
          maxItems: 200
          items: { type: integer, format: int32, minimum: 0 }
          description: Optional initial roster — every id must be an active user.
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
    TeamMemberResponse:
      type: object
      required: [userId, name, email, deleted]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        deleted:
          type: boolean
          description: The user was soft-deleted after joining; the row stays for the record.
    TeamResponse:
      type: object
      required: [id, name, members, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberResponse'
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, memberCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        memberCount:
          type: integer
          minimum: 0
          description: Active members only.
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DomainRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
    DomainResponse:
      type: object
      required: [id, name, systemCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        systemCount:
          type: integer
          minimum: 0
          description: Active systems inside the domain.
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    DomainPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DomainResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    SystemRequest:
      type: object
      required: [domainId, name]
      properties:
        domainId: { type: integer, format: int32, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
    KafkaSecurityProtocol:
      type: string
      enum: [PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL]
    KafkaSaslMechanism:
      type: string
      enum: [PLAIN, SCRAM-SHA-256, SCRAM-SHA-512]
    KafkaTargetRequest:
      type: object
      required: [bootstrapServers, securityProtocol]
      properties:
        bootstrapServers: { type: string, maxLength: 1024, description: "1–20 comma-separated host:port entries." }
        securityProtocol: { $ref: '#/components/schemas/KafkaSecurityProtocol' }
        saslMechanism:
          allOf: [{ $ref: '#/components/schemas/KafkaSaslMechanism' }]
          nullable: true
        username: { type: string, nullable: true, maxLength: 200 }
        password: { type: string, nullable: true, maxLength: 1000, description: "Write-only. Absent on a PUT keeps the stored password." }
    PostgresTargetRequest:
      type: object
      required: [jdbcUrl, username]
      properties:
        jdbcUrl: { type: string, maxLength: 2048, description: "`jdbc:postgresql://host:port/db`, parameters limited to ssl, sslmode, currentSchema, ApplicationName. Give the try-it feature a READ-ONLY role." }
        username: { type: string, maxLength: 200 }
        password: { type: string, nullable: true, maxLength: 1000, description: "Write-only. Absent on a PUT keeps the stored password." }
    EnvironmentRequest:
      type: object
      required: [systemId, name]
      properties:
        systemId: { type: integer, format: int32, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, nullable: true, maxLength: 2000 }
        httpBaseUrl: { type: string, nullable: true, maxLength: 2048, description: "Absolute http(s) URL without credentials, query or fragment; replaces the document's servers." }
        kafka:
          allOf: [{ $ref: '#/components/schemas/KafkaTargetRequest' }]
          nullable: true
        postgres:
          allOf: [{ $ref: '#/components/schemas/PostgresTargetRequest' }]
          nullable: true
    KafkaTargetResponse:
      type: object
      required: [bootstrapServers, securityProtocol, hasPassword]
      properties:
        bootstrapServers: { type: string }
        securityProtocol: { $ref: '#/components/schemas/KafkaSecurityProtocol' }
        saslMechanism:
          allOf: [{ $ref: '#/components/schemas/KafkaSaslMechanism' }]
          nullable: true
        username: { type: string, nullable: true }
        hasPassword: { type: boolean }
    PostgresTargetResponse:
      type: object
      required: [jdbcUrl, username, hasPassword]
      properties:
        jdbcUrl: { type: string }
        username: { type: string }
        hasPassword: { type: boolean }
    EnvironmentResponse:
      type: object
      required: [id, systemId, systemName, name, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        systemId: { type: integer, format: int32, minimum: 0 }
        systemName: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        httpBaseUrl: { type: string, nullable: true }
        kafka:
          allOf: [{ $ref: '#/components/schemas/KafkaTargetResponse' }]
          nullable: true
        postgres:
          allOf: [{ $ref: '#/components/schemas/PostgresTargetResponse' }]
          nullable: true
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    EnvironmentPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    SystemResponse:
      type: object
      required: [id, domainId, domainName, name, contractCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        domainId: { type: integer, format: int32, minimum: 0 }
        domainName: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        contractCount:
          type: integer
          minimum: 0
          description: Active contracts inside the system (0 until the contracts feature lands).
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    SystemPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SystemResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }

    ContractType:
      type: string
      enum: [OPENAPI, ASYNCAPI, ODCS]
    Lifecycle:
      type: string
      enum: [DRAFT, PROPOSED, ACTIVE, DEPRECATED, RETIRED]
    DocumentFormat:
      type: string
      enum: [yaml, json]
    OwnerKind:
      type: string
      enum: [TEAM, USER]
    OwnerRef:
      type: object
      required: [kind, id, name, deleted]
      properties:
        kind: { $ref: '#/components/schemas/OwnerKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        deleted: { type: boolean }
    RefSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
    LatestVersionSummary:
      type: object
      required: [id, version, lifecycle, checkErrors, checkWarnings, checkComplete]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        version: { type: string }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        checkErrors: { type: integer, minimum: 0 }
        checkWarnings: { type: integer, minimum: 0 }
        checkComplete: { type: boolean }
    ContractCreateRequest:
      type: object
      required: [systemId, type, name]
      properties:
        systemId: { type: integer, format: int32, minimum: 0 }
        type: { $ref: '#/components/schemas/ContractType' }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
        ownerTeamId: { type: integer, format: int32, minimum: 0, nullable: true }
        ownerUserId: { type: integer, format: int32, minimum: 0, nullable: true }
    ContractUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
    OwnerUpdateRequest:
      type: object
      properties:
        ownerTeamId: { type: integer, format: int32, minimum: 0, nullable: true }
        ownerUserId: { type: integer, format: int32, minimum: 0, nullable: true }
    ContractResponse:
      type: object
      required: [id, system, domain, type, name, owner, versionCount, canWrite, createdBy, createdAt, updatedAt, subscribed, subscriberCount]
      properties:
        subscribed: { type: boolean, description: "Whether the CALLER follows the contract — every event on it then reaches their bell." }
        subscriberCount: { type: integer, minimum: 0 }
        id: { type: integer, format: int32, minimum: 0 }
        system: { $ref: '#/components/schemas/RefSummary' }
        domain: { $ref: '#/components/schemas/RefSummary' }
        type: { $ref: '#/components/schemas/ContractType' }
        name: { type: string }
        description: { type: string, nullable: true }
        owner: { $ref: '#/components/schemas/OwnerRef' }
        latestVersion:
          allOf: [{ $ref: '#/components/schemas/LatestVersionSummary' }]
          nullable: true
        versionCount: { type: integer, minimum: 0 }
        canWrite:
          type: boolean
          description: The writer rule for the caller — server-computed, never reimplemented client-side.
        createdBy: { type: integer, format: int32, minimum: 0 }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    ContractPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    FacetCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string, description: "An enum name, or `NONE` for contracts without a version (lifecycle facet)." }
        count: { type: integer, format: int64, minimum: 0 }
    NamedFacetCount:
      type: object
      required: [id, name, count]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        count: { type: integer, format: int64, minimum: 0 }
    ErrorFacets:
      type: object
      required: [withErrors, clean]
      properties:
        withErrors: { type: integer, format: int64, minimum: 0 }
        clean: { type: integer, format: int64, minimum: 0 }
    FacetsResponse:
      type: object
      required: [type, lifecycle, domain, system, ownerTeam, hasErrors]
      properties:
        type: { type: array, items: { $ref: '#/components/schemas/FacetCount' } }
        lifecycle: { type: array, items: { $ref: '#/components/schemas/FacetCount' } }
        domain: { type: array, items: { $ref: '#/components/schemas/NamedFacetCount' } }
        system: { type: array, items: { $ref: '#/components/schemas/NamedFacetCount' } }
        ownerTeam: { type: array, items: { $ref: '#/components/schemas/NamedFacetCount' } }
        hasErrors: { $ref: '#/components/schemas/ErrorFacets' }
    TreeContract:
      type: object
      required: [id, name, type, owner, versionCount, canWrite, subscribed, subscriberCount]
      properties:
        subscribed: { type: boolean, description: "Whether the CALLER follows the contract — every event on it then reaches their bell." }
        subscriberCount: { type: integer, minimum: 0 }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        type: { $ref: '#/components/schemas/ContractType' }
        owner: { $ref: '#/components/schemas/OwnerRef' }
        latestVersion:
          allOf: [{ $ref: '#/components/schemas/LatestVersionSummary' }]
          nullable: true
        versionCount: { type: integer, minimum: 0 }
        canWrite: { type: boolean }
    TreeSystem:
      type: object
      required: [id, name, contracts]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        contracts:
          type: array
          items: { $ref: '#/components/schemas/TreeContract' }
    TreeDomain:
      type: object
      required: [id, name, systems]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        systems:
          type: array
          items: { $ref: '#/components/schemas/TreeSystem' }
    TreeResponse:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items: { $ref: '#/components/schemas/TreeDomain' }
    ExportedVersion:
      type: object
      required: [version, lifecycle, format, content]
      properties:
        version: { type: string }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        content: { type: string }
    ContractExportResponse:
      type: object
      required: [contract, versions]
      properties:
        contract: { $ref: '#/components/schemas/ContractResponse' }
        versions:
          type: array
          items: { $ref: '#/components/schemas/ExportedVersion' }
    ContractEventType:
      type: string
      enum: [CREATED, UPDATED, OWNER_CHANGED, DELETED, VERSION_CREATED, VERSION_CONTENT_UPDATED, VERSION_TRANSITIONED, VERSION_DELETED, VERSION_RECHECKED, VERSION_SOURCE_CHANGED, VERSION_SYNCED, IMPORTED]
    ContractEventResponse:
      type: object
      required: [id, contractId, userId, userName, timestamp, type, params]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        contractId: { type: integer, format: int32, minimum: 0 }
        userId: { type: integer, format: int32, minimum: 0 }
        userName: { type: string }
        timestamp: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/ContractEventType' }
        params:
          type: object
          additionalProperties: { type: string }
    ContractEventPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractEventResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    NotificationType:
      type: string
      enum: [CONTRACT_UPDATED, CONTRACT_OWNER_CHANGED, CONTRACT_DELETED, VERSION_CREATED, VERSION_CONTENT_UPDATED, VERSION_TRANSITIONED, VERSION_DELETED, VERSION_SYNCED, VERSION_SOURCE_CHANGED, VERSION_IMPORTED, VERSION_BREAKING_STORED]
      description: The notification kind; the SPA renders it in the viewer's language. A kind a client build does not know renders as its raw name.
    NotificationResponse:
      type: object
      required: [id, recipientId, timestamp, type, params, wasSeen]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        recipientId: { type: integer, format: int32, minimum: 0 }
        timestamp: { type: integer, format: int64, description: Epoch millis when the notification was minted. Server-set. }
        type: { $ref: '#/components/schemas/NotificationType' }
        params:
          type: object
          additionalProperties: { type: string }
          description: The interpolation values — `contractName`, `actor`, and the event's `version`/`from`/`to`/`name` when present. Never document text.
        link: { type: string, nullable: true, description: A language-independent SPA path (the contract or the version). }
        wasSeen: { type: boolean }
    NotificationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    HttpParameterSummary:
      type: object
      required: [name, location, required]
      properties:
        name: { type: string }
        location: { type: string, description: "path | query | header | cookie" }
        required: { type: boolean }
        type: { type: string, nullable: true, description: "The declared schema type, when a scalar." }
    HttpRequestBodySummary:
      type: object
      required: [required, mediaTypes]
      properties:
        required: { type: boolean }
        mediaTypes: { type: array, items: { type: string } }
    HttpOperationSummary:
      type: object
      required: [method, path, parameters, responses, securityHeaders]
      properties:
        operationId: { type: string, nullable: true }
        method: { type: string, description: Upper-case HTTP method. }
        path: { type: string, description: "The path template as declared (`/pets/{id}`)." }
        summary: { type: string, nullable: true }
        parameters: { type: array, items: { $ref: '#/components/schemas/HttpParameterSummary' } }
        requestBody:
          allOf: [{ $ref: '#/components/schemas/HttpRequestBodySummary' }]
          nullable: true
        responses: { type: array, items: { type: string }, description: "The declared response keys — `200`, `2XX`, `default`." }
        securityHeaders: { type: array, items: { type: string } }
    KafkaMessageSummary:
      type: object
      required: [name]
      properties:
        name: { type: string }
        contentType: { type: string, nullable: true }
        schemaFormat: { type: string, nullable: true }
        payloadPointer: { type: string, nullable: true, description: The payload schema's JSON pointer in the document. }
    KafkaChannelSummary:
      type: object
      required: [channel, address, actions, messages]
      properties:
        channel: { type: string, description: The channel's key (3.x) or address (2.x). }
        address: { type: string, description: The topic. }
        actions: { type: array, items: { type: string }, description: "3.x send/receive, 2.x publish/subscribe." }
        messages: { type: array, items: { $ref: '#/components/schemas/KafkaMessageSummary' } }
    SqlPropertySummary:
      type: object
      required: [name, required]
      properties:
        name: { type: string }
        physicalName: { type: string, nullable: true }
        logicalType: { type: string, nullable: true }
        physicalType: { type: string, nullable: true }
        required: { type: boolean }
    SqlDatasetSummary:
      type: object
      required: [name, properties]
      properties:
        name: { type: string }
        physicalName: { type: string, nullable: true }
        physicalType: { type: string, nullable: true }
        properties: { type: array, items: { $ref: '#/components/schemas/SqlPropertySummary' } }
    TryCatalogResponse:
      type: object
      required: [type, http, kafka, sql]
      properties:
        type: { $ref: '#/components/schemas/ContractType' }
        http: { type: array, items: { $ref: '#/components/schemas/HttpOperationSummary' } }
        kafka: { type: array, items: { $ref: '#/components/schemas/KafkaChannelSummary' } }
        sql: { type: array, items: { $ref: '#/components/schemas/SqlDatasetSummary' } }
    StringMap:
      type: object
      additionalProperties: { type: string }
    TryHttpRequest:
      type: object
      required: [environmentId, method, path]
      properties:
        environmentId: { type: integer, format: int32, minimum: 0 }
        method: { type: string, description: "GET, PUT, POST, DELETE, OPTIONS, HEAD or PATCH — an operation the document declares on `path`." }
        path: { type: string, description: "The path template exactly as declared, e.g. `/pets/{id}`." }
        pathParams: { $ref: '#/components/schemas/StringMap' }
        query: { $ref: '#/components/schemas/StringMap' }
        headers: { $ref: '#/components/schemas/StringMap' }
        contentType: { type: string, nullable: true, description: "Defaults to application/json when a body is sent." }
        body: { type: string, nullable: true, maxLength: 1048576 }
    TryHttpResponse:
      type: object
      required: [url, status, headers, bodyTruncated, durationMs, conformance]
      properties:
        url: { type: string, description: "The URL called, without its query string." }
        status: { type: integer, format: int32 }
        headers: { $ref: '#/components/schemas/StringMap' }
        body: { type: string, nullable: true }
        bodyTruncated: { type: boolean }
        durationMs: { type: integer, format: int64 }
        conformance: { $ref: '#/components/schemas/ConformanceReport' }
    ConformanceReport:
      type: object
      required: [findings, errors, warnings, infos]
      properties:
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        errors: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        infos: { type: integer, minimum: 0 }
        validatedAgainst: { type: string, nullable: true, description: The JSON pointer of the schema the observation was validated against. }
    Severity:
      type: string
      enum: [ERROR, WARN, INFO]
    FindingSource:
      type: string
      enum: [SYNTAX, SCHEMA, SEMANTIC, LINT, BREAKING, CONFORMANCE, SYSTEM]
    Finding:
      type: object
      required: [severity, source, code, message]
      properties:
        severity: { $ref: '#/components/schemas/Severity' }
        source: { $ref: '#/components/schemas/FindingSource' }
        code: { type: string }
        message: { type: string }
        path: { type: string, nullable: true, description: A JSON pointer into the document. }
        line: { type: integer, minimum: 1, nullable: true }
        column: { type: integer, minimum: 1, nullable: true }
    CheckReport:
      type: object
      required: [findings, errors, warnings, infos, checkerAvailable]
      properties:
        format:
          allOf: [{ $ref: '#/components/schemas/DocumentFormat' }]
          nullable: true
        specVersion: { type: string, nullable: true }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        declaredVersion:
          type: string
          nullable: true
          description: The version the document itself claims (`info.version`, ODCS `version`) — the import form's prefill.
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        errors: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        infos: { type: integer, minimum: 0 }
        checkerAvailable:
          type: boolean
          description: False when the checker sidecar could not be reached — its LINT/SEMANTIC verdicts are missing.
        baselineVersion:
          type: string
          nullable: true
          description: The ACTIVE version the document was compared against for breaking changes; null when none applied.
    DocumentCheckRequest:
      type: object
      required: [type, content]
      properties:
        type: { $ref: '#/components/schemas/ContractType' }
        content: { type: string }
        version: { type: string, nullable: true, description: The SemVer the document is (to be) stored as — drives the version cross-check. }
        contractId:
          type: integer
          minimum: 0
          nullable: true
          description: The contract the document belongs to — its highest ACTIVE version below `version` becomes the breaking-change baseline.
    VersionCreateRequest:
      type: object
      required: [version, content]
      properties:
        version: { type: string, minLength: 5, maxLength: 64, description: SemVer 2.0 }
        content: { type: string, description: "Raw YAML or JSON text, at most 2 MiB." }
        sourceUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: |
            The https URL the text was fetched from, when it was: stored as the version's source
            reference AND stamped as synced (the text IS the repo copy right now). Static guards only
            (absolute https, no credentials) — a rejected value is a 400.
    VersionSourceRequest:
      type: object
      properties:
        sourceUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: The new reference; null or blank clears it. A CHANGED reference resets the sync state.
    SyncStateResponse:
      type: object
      required: [lastSyncedAt]
      properties:
        sourceUrl: { type: string, nullable: true, maxLength: 2048 }
        lastSyncedAt: { type: integer, format: int64, minimum: 0, description: "Epoch millis; 0 = never synced." }
        syncedContent:
          type: string
          nullable: true
          description: The text as pulled at the last sync — the Covenant-vs-repo comparison baseline; null = never.
    SyncRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, description: "The repo copy's raw text, at most 2 MiB (fetched client-side through POST /contracts/fetch)." }
    VersionContentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
    TransitionRequest:
      type: object
      required: [to]
      properties:
        to: { $ref: '#/components/schemas/Lifecycle' }
    VersionResponse:
      type: object
      required: [id, contractId, version, lifecycle, format, content, contentSha256, findings, checkErrors, checkWarnings, checkInfos, checkComplete, checkedAt, createdBy, createdAt, updatedAt, lastSyncedAt]
      properties:
        sourceUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: The https URL of the version's repo copy; null = no reference.
        lastSyncedAt:
          type: integer
          format: int64
          minimum: 0
          description: Epoch millis of the last repo → Covenant sync; 0 = never. `updatedAt > lastSyncedAt` means edited in Covenant since.
        id: { type: integer, format: int32, minimum: 0 }
        contractId: { type: integer, format: int32, minimum: 0 }
        version: { type: string }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        content: { type: string }
        contentSha256: { type: string }
        docTitle: { type: string, nullable: true }
        docDescription: { type: string, nullable: true }
        specVersion: { type: string, nullable: true }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        checkErrors: { type: integer, minimum: 0 }
        checkWarnings: { type: integer, minimum: 0 }
        checkInfos: { type: integer, minimum: 0 }
        checkComplete: { type: boolean }
        checkedAt: { type: integer, format: int64 }
        createdBy: { type: integer, format: int32, minimum: 0 }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    VersionListItem:
      type: object
      required: [id, contractId, version, lifecycle, format, checkErrors, checkWarnings, checkInfos, checkComplete, createdBy, createdAt, updatedAt, lastSyncedAt]
      properties:
        sourceUrl: { type: string, nullable: true, maxLength: 2048 }
        lastSyncedAt: { type: integer, format: int64, minimum: 0, description: "Epoch millis; 0 = never synced." }
        id: { type: integer, format: int32, minimum: 0 }
        contractId: { type: integer, format: int32, minimum: 0 }
        version: { type: string }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        docTitle: { type: string, nullable: true }
        specVersion: { type: string, nullable: true }
        checkErrors: { type: integer, minimum: 0 }
        checkWarnings: { type: integer, minimum: 0 }
        checkInfos: { type: integer, minimum: 0 }
        checkComplete: { type: boolean }
        createdBy: { type: integer, format: int32, minimum: 0 }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    VersionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VersionListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    ImportItem:
      type: object
      required: [systemId, type, name, version, content]
      properties:
        systemId: { type: integer, format: int32, minimum: 0 }
        type: { $ref: '#/components/schemas/ContractType' }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
        ownerTeamId: { type: integer, format: int32, minimum: 0, nullable: true }
        ownerUserId: { type: integer, format: int32, minimum: 0, nullable: true }
        version: { type: string }
        content: { type: string }
        sourceUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: The https URL the document was fetched from, when it was — stored on the new version and stamped as synced.
    ImportRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ImportItem' }
    ImportStatus:
      type: string
      enum: [CREATED, CREATED_WITH_FINDINGS, VERSION_ADDED, VERSION_ADDED_WITH_FINDINGS, INVALID, CONFLICT, FORBIDDEN, ERROR]
    ImportItemResult:
      type: object
      required: [index, name, version, status, errors, warnings]
      properties:
        index: { type: integer, minimum: 0 }
        name: { type: string }
        version: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
        contractId: { type: integer, format: int32, minimum: 0, nullable: true }
        versionId: { type: integer, format: int32, minimum: 0, nullable: true }
        message: { type: string, nullable: true }
        errors: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
    ImportResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ImportItemResult' }
    FetchUrlRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: An absolute https URL of a public host. }
    FetchUrlResponse:
      type: object
      required: [content]
      properties:
        content: { type: string }

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
