openapi: 3.1.0
info:
  title: covenant-api
  version: 1.0.0
  description: |
    JWT-authenticated REST API for Covenant — a contract repository where development teams
    publish and share their integration contracts (OpenAPI, AsyncAPI, ODCS) with SemVer
    versions and lifecycles. This scaffold exposes the authentication surface and the
    admin-managed user accounts; the contract catalog (domains, systems, contracts, versions)
    lands feature by feature.

    Authorization model: every user is implicitly a regular user; additional global roles
    (`ADMIN`) are carried as the `roles` array and only ever ADD privileges on top of that
    baseline. `ADMIN` is the management role and owns the whole `/users` surface.

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`).
    Any endpoint may additionally return `500` (`InternalServerError`) on an
    unexpected server fault.
servers:
  - url: http://localhost:8082
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: users
  - name: teams
  - name: domains
  - name: systems
  - name: contracts
  - name: contract-versions

paths:
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter.

        **Email MFA (opt-in via the `MFA` feature flag):** when the account has MFA enabled,
        correct credentials answer `200` with an `MfaChallengeResponse` instead of tokens — a
        6-digit code is emailed to the account, and the client exchanges it together with the
        `challengeId` at `POST /api/v1/login/mfa` for the ordinary `LoginResponse`. On a
        deployment without outbound email (`MAIL_TRANSPORT=disabled`) an MFA-enabled login
        fails closed with `503`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token issued, or (MFA-enabled accounts) a second-factor challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: MFA is enabled for the account but this deployment cannot send email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/login/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Exchange an MFA challenge and emailed code for a JWT pair
      description: |
        Second login step for MFA-enabled accounts. The `challengeId` comes from the login
        response, the 6-digit `code` from the email. Challenges are single-use, expire after
        a short TTL (default 5 min, `MFA_CODE_TTL_SECONDS`), and allow a few attempts
        (default 5, `MFA_MAX_ATTEMPTS`); every failure mode — unknown challenge, expired,
        wrong code, attempts exhausted, user gone — answers the uniform `401`. Rate-limited
        per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal. Accepts a valid, unexpired, non-revoked refresh token and
        returns a brand-new access token and refresh token (each with a full TTL). The presented
        refresh token is left valid until its own expiry — it is not rotated out. Requires no
        `Authorization` header (the access token may already be expired). Returns `401` for a
        missing/invalid/expired/revoked refresh token, if the user no longer exists, or if the
        token was minted before the user's most recent password change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body, it is revoked too. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: |
        Always answers `202` for a well-formed request, whether or not an account with that
        email exists (no account enumeration; the actual work happens asynchronously). If the
        account exists, a new password is generated, its hash replaces the old one (which stops
        working, and all outstanding refresh tokens are invalidated), and the password is sent
        to the account's email address. Throttled per submitted email — one request per interval
        (default 60 s, `PASSWORD_RESET_MIN_INTERVAL_SECONDS`) — uniformly for existing and
        unknown addresses, and rate-limited per client IP. A soft-deleted account is unknown
        here (no password is minted, no email sent; the `202` stays uniform). Answers `503` on
        deployments without outbound email (`MAIL_TRANSPORT=disabled`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email (password reset unavailable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (management view)
      description: |
        ADMIN only — the whole management surface is admin-gated; regular users keep only
        their self password change.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email` (deliberately not `roles` — a set has no
          order). Default sort is `id` ascending; `id` ascending is always appended as a
          deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `name` / `email` — case- and accent-insensitive substring matches.
          - `role` — `ADMIN` (holders of the additional role) or `USER` (plain users).
          - `feature` + `featureEnabled` — feature-flag state (the pair must come
            together, `400` otherwise; `featureEnabled` is a strict boolean).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: email
          in: query
          required: false
          schema: { type: string }
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, USER] }
        - name: feature
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Feature' }
          description: Feature-flag state filter — must be paired with `featureEnabled` (400 otherwise).
        - name: featureEnabled
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean — only users with `feature` enabled (true) or disabled (false).
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        ADMIN only. The initial password is CLIENT-generated (the SPA's 96-bit generator) and
        shown to the admin exactly once — the server stores only the bcrypt hash and no
        response ever carries plaintext. The email is canonicalized (trimmed + lowercased);
        a duplicate among active accounts is a `409` (a soft-deleted account frees its email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error (blank/too-long name or email, password rules)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user
      description: Target user or ADMIN (guard-before-read — an unauthorized caller 403s uniformly).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: updateUser
      summary: Update a user's name, email, and roles
      description: |
        ADMIN only. The password is deliberately not writable here (it has its own endpoint).
        Demoting the LAST active administrator is a `409` — the management surface must stay
        reachable. An email already used by another active account is also a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        ADMIN only, soft delete: the account can no longer sign in, outstanding refresh
        tokens die (`user_gone`), the email is freed for reuse, and the user's catalog files
        stay with a deleted-creator marker. Deleting YOURSELF is a `403`; deleting the LAST
        active administrator is a `409`.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN, or attempted to delete their own account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/features:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserDisabledFeatures
      summary: Replace a user's disabled-feature set (ADMIN only)
      description: |
        Per-user feature flags: a **wholesale replace** of the target user's DISABLED set —
        an empty array re-enables everything (idempotent, a same-set re-PUT is `204` again).
        **ADMIN-only**; changing one's OWN flags is allowed (the users routes themselves are
        never feature-gated, so an admin can always find their way back). `MFA` is the one
        inverted-default flag: users start with it in the disabled set, and a set omitting it
        — the empty "re-enable everything" array included — ENABLES the login second factor.
        The set rides the JWT, so a change takes effect at the target's next token refresh
        (≤15 min) or login. Audited as `user.features_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeaturesUpdateRequest'
      responses:
        '204': { description: Disabled-feature set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/language:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserLanguage
      summary: Set a user's language (target user or ADMIN)
      description: |
        The ONE synced per-user language: it drives the UI at sign-in (rides `LoginResponse`,
        applied by the SPA on login/MFA/refresh) and the language of every email sent to the
        user (read fresh at send time, so a change takes effect immediately for emails; the
        UI picks it up at the next sign-in or token refresh). **Target user or ADMIN** — the
        header language switcher is the self-service writer (switching while signed in also
        saves here); an admin may fix a mis-set language. Idempotent (a same-value re-PUT is
        `204` again); an unsupported code is `400`. Audited as `user.language_changed` on an
        actual change. Set initially at create (`UserCreateRequest.language`, default `en`);
        the whole-user PUT deliberately never touches it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLanguageUpdateRequest'
      responses:
        '204': { description: Language set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        (already-issued access tokens expire naturally within their TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters or longer than 71 UTF-8 bytes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List teams
      description: |
        Any authenticated user — teams are the ownership unit every contract points at, so the
        owner pickers and the Teams page read them; every mutation below is ADMIN only.

        - Sortable fields: `id`, `name`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring), `memberId` (only teams the
          user is a member of — the caller's own id yields "my teams").
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: memberId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
      responses:
        '200':
          description: A page of teams (rosters collapsed to an active-member count)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      description: |
        ADMIN only (guarded before the body decodes — a non-admin's malformed body is still
        403). An optional initial roster: every id must be an active user (`400` otherwise). A
        case-insensitive name clash with an active team is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '201':
          description: Created; `Location` points at the new team
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: Get a team with its roster
      description: Any authenticated user. Soft-deleted members stay in the roster, flagged `deleted`.
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [teams]
      operationId: updateTeam
      summary: Rename / re-describe a team
      description: ADMIN only, guard before the id lookup (uniform 403). The roster is managed per member below.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: Delete a team (soft)
      description: |
        ADMIN only, guard before the id lookup. Soft delete — the name is freed for reuse. A team
        that still owns an active contract answers `409` (the rule lands with the contracts feature).
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    post:
      tags: [teams]
      operationId: addTeamMember
      summary: Add a user to a team
      description: ADMIN only. The user must be active (`404` otherwise); an existing member is `409`.
      responses:
        '204':
          description: Added
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: removeTeamMember
      summary: Remove a user from a team
      description: ADMIN only. A membership that does not exist is `404` (a soft-deleted member's row can still be removed).
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/domains:
    get:
      tags: [domains]
      operationId: listDomains
      summary: List domains
      description: |
        Any authenticated user — the domain registry is the hierarchy's spine and the pickers'
        source; every mutation below is ADMIN only.

        - Sortable fields: `id`, `name`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A page of domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [domains]
      operationId: createDomain
      summary: Create a domain
      description: |
        ADMIN only (guarded before the body decodes). A case-insensitive name clash with an active domain is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainRequest'
      responses:
        '201':
          description: Created; `Location` points at the new domain
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/domains/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [domains]
      operationId: getDomain
      summary: Get a domain
      description: Any authenticated user.
      responses:
        '200':
          description: The domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [domains]
      operationId: updateDomain
      summary: Replace a domain
      description: |
        ADMIN only, guard before the id lookup (uniform 403). Full replace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainRequest'
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [domains]
      operationId: deleteDomain
      summary: Delete a domain (soft)
      description: |
        ADMIN only, guard before the id lookup. Refused with `409` while the domain still holds an active system — the tree never dangles.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/systems:
    get:
      tags: [systems]
      operationId: listSystems
      summary: List systems
      description: |
        Any authenticated user — the system registry is the hierarchy's spine and the pickers'
        source; every mutation below is ADMIN only.

        - Sortable fields: `id`, `name`, `domainId`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring), `domainId` (only systems of that domain).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: domainId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
      responses:
        '200':
          description: A page of systems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [systems]
      operationId: createSystem
      summary: Create a system
      description: |
        ADMIN only (guarded before the body decodes). `domainId` must be an active domain (`400` otherwise); a case-insensitive name clash with an active system IN THE SAME DOMAIN is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRequest'
      responses:
        '201':
          description: Created; `Location` points at the new system
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/systems/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [systems]
      operationId: getSystem
      summary: Get a system
      description: Any authenticated user.
      responses:
        '200':
          description: The system
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [systems]
      operationId: updateSystem
      summary: Replace a system
      description: |
        ADMIN only, guard before the id lookup (uniform 403). Full replace — a changed `domainId` MOVES the system to another domain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRequest'
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [systems]
      operationId: deleteSystem
      summary: Delete a system (soft)
      description: |
        ADMIN only, guard before the id lookup. Refused with `409` while the system still holds an active contract (the rule lands with the contracts feature).
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts:
    get:
      tags: [contracts]
      operationId: listContracts
      summary: List contracts
      description: |
        Any authenticated user. Every row carries `canWrite`, the server's verdict of the writer
        rule for the caller (owning team member, owning user, or ADMIN).

        - Sortable fields: `id`, `name`, `type`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `domainId`, `systemId`, `ownerTeamId`, `ownerUserId` (equality); `type` and
          `lifecycle` (of the LATEST version) are repeatable any-of params; `q` matches name OR
          description case- and accent-insensitively; `hasErrors` (strict boolean) selects
          contracts whose latest version has blocking findings (or none).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/ContractDomainId'
        - $ref: '#/components/parameters/ContractSystemId'
        - $ref: '#/components/parameters/ContractType'
        - $ref: '#/components/parameters/ContractOwnerTeamId'
        - $ref: '#/components/parameters/ContractOwnerUserId'
        - $ref: '#/components/parameters/ContractLifecycle'
        - $ref: '#/components/parameters/ContractQuery'
        - $ref: '#/components/parameters/ContractHasErrors'
      responses:
        '200':
          description: A page of contracts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [contracts]
      operationId: createContract
      summary: Create a contract (no version yet)
      description: |
        Any authenticated user may create a contract they can own: the owner is themselves or a
        team they belong to (ADMIN assigns anyone) — `403` otherwise. Exactly one of
        `ownerTeamId`/`ownerUserId`; the system must be active (`400`); a case-insensitive name
        clash within the system is `409`. Type and system are immutable afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCreateRequest'
      responses:
        '201':
          description: Created; `Location` points at the new contract
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/tree:
    get:
      tags: [contracts]
      operationId: getContractTree
      summary: The Domain → System → Contract hierarchy
      description: |
        Any authenticated user. Unpaged — the registries are ADMIN-curated and small; the contract
        level honours the list's `type`, `lifecycle` and `q` filters, and a domain or system with
        no matching contract still appears (the spine never hides a container).
      parameters:
        - $ref: '#/components/parameters/ContractType'
        - $ref: '#/components/parameters/ContractLifecycle'
        - $ref: '#/components/parameters/ContractQuery'
        - $ref: '#/components/parameters/ContractOwnerTeamId'
        - $ref: '#/components/parameters/ContractOwnerUserId'
      responses:
        '200':
          description: The tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/versions/check:
    post:
      tags: [contract-versions]
      operationId: checkDocument
      summary: Live-check a document without storing it
      description: |
        Any authenticated user. The same pipeline every store path runs — syntax → type gate →
        schema/semantic (JVM) → lint/semantic (the checker sidecar) → breaking changes →
        cross-checks — returned as findings-so-far: a broken document is a `200` whose report
        carries the HARD finding, never a `400`. Pass `version` to get the declared-version
        cross-check; pass `contractId` too and the document is compared against that contract's
        highest ACTIVE version below `version` (the report's `baselineVersion`): each breaking
        change is a `BREAKING` finding — INFO once `version` carries the MAJOR bump, otherwise
        WARN plus one soft ERROR `BREAKING_WITHOUT_MAJOR_BUMP`. Nothing stored, no audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCheckRequest'
      responses:
        '200':
          description: The check report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/import:
    post:
      tags: [contract-versions]
      operationId: importContracts
      summary: Import documents as new versions (report & skip)
      description: |
        Any authenticated user, at most 20 items. Each item is one document landing as a new
        version of a contract that may or may not exist yet — a new contract needs an assignable
        owner, an existing one must match the item's type and be writable by the caller. Import
        ALWAYS waives soft findings (`*_WITH_FINDINGS`); only HARD findings, the SemVer rules, a
        type mismatch and the writer rule skip an item. Nothing rethrows: the rows ARE the outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: One result row per item, in order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/import/check:
    post:
      tags: [contract-versions]
      operationId: checkImport
      summary: The import's dry run
      description: The identical per-item classification with nothing stored — `contractId` is set only for existing contracts, `versionId` never.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: The predicted rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/fetch:
    post:
      tags: [contract-versions]
      operationId: fetchDocumentUrl
      summary: Fetch a document from a public https URL (SSRF-guarded)
      description: |
        Any authenticated user. The server issues the outbound GET on the caller's behalf — https
        only, no userinfo, every resolved address public (loopback/private/link-local/CGNAT/NAT64
        refused), no redirects, 1 MiB cap. A guard rejection is the uniform `400`; an upstream
        failure (non-200, redirect, oversize, unreachable) is `502`. GitHub/GitLab blob links are
        rewritten to raw by the SPA before calling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchUrlRequest'
      responses:
        '200':
          description: The fetched text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchUrlResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/v1/contracts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [contracts]
      operationId: getContract
      summary: Get a contract
      description: Any authenticated user; `canWrite` is computed for the caller.
      responses:
        '200':
          description: The contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [contracts]
      operationId: updateContract
      summary: Rename / re-describe a contract
      description: Writers only (owning team member, owning user, ADMIN — checked before the body decodes). Type and system are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUpdateRequest'
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [contracts]
      operationId: deleteContract
      summary: Delete a contract (soft, with its versions)
      description: Writers only. Refused with `409` while any version is ACTIVE or DEPRECATED — retire them first.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/owner:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [contracts]
      operationId: transferContractOwner
      summary: Transfer ownership (ADMIN)
      description: ADMIN only. Exactly one of `ownerTeamId`/`ownerUserId`, an active team/user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerUpdateRequest'
      responses:
        '204':
          description: Transferred
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/export:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [contracts]
      operationId: exportContract
      summary: The contract with every version's verbatim document
      description: Any authenticated user. Versions highest first; each carries its lifecycle, format and raw text — the round trip's outbound half.
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractExportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [contracts]
      operationId: listContractEvents
      summary: The contract's structural change history
      description: |
        Any authenticated user (whoever reads a contract reads its history). Paged, newest first
        (`-timestamp,-id`); sortable on `timestamp`/`id` only. Events are structural — type plus
        a params map the SPA localizes (`version`, `from`/`to`, `owner.from`/`owner.to`, `name`) —
        never document text.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractEventPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [contract-versions]
      operationId: listContractVersions
      summary: List a contract's versions (no content)
      description: |
        Any authenticated user. Default sort `-version` (highest SemVer first — `version` sorts by
        the parsed triple, a release above its prereleases); also `id`, `lifecycle`, `createdAt`,
        `updatedAt`. `lifecycle` is a repeatable any-of filter.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/ContractLifecycle'
      responses:
        '200':
          description: A page of versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [contract-versions]
      operationId: createContractVersion
      summary: Add a DRAFT version
      description: |
        Writers only. `version` must be SemVer 2.0, unique on the contract (`409`) and greater
        than every existing version (`400`). The document must pass the HARD gate — parseable,
        the contract's standard (`400`, never waivable); a SOFT `ERROR` finding blocks unless
        `allowInvalid=true` (the editor's Save-anyway; the findings are re-obtainable through
        `POST /contracts/versions/check`). The check report is stored with the text; the
        response carries content and findings. Documents above 2 MiB are `413`.
      parameters:
        - $ref: '#/components/parameters/AllowInvalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCreateRequest'
      responses:
        '201':
          description: Created; `Location` points at the new version
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [contract-versions]
      operationId: getContractVersion
      summary: Get a version with its document and findings
      responses:
        '200':
          description: The version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [contract-versions]
      operationId: deleteContractVersion
      summary: Delete a DRAFT version
      description: Writers only; only a DRAFT may be deleted (`409` otherwise). The contract's latest pointer is recomputed.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}/content:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [contract-versions]
      operationId: getContractVersionContent
      summary: The raw document text
      description: |
        Any authenticated user. `application/yaml` or `application/json` by the stored format;
        `download=true` adds `Content-Disposition: attachment` with a `<system>__<contract>__<version>.<ext>` filename.
      parameters:
        - name: download
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The document, byte-exact
          content:
            application/yaml:
              schema: { type: string }
            application/json:
              # The stored JSON document itself — any shape.
              schema: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [contract-versions]
      operationId: updateContractVersionContent
      summary: Replace the document of a DRAFT/PROPOSED version
      description: Writers only. `409` from ACTIVE on (the document is read-only — add a version). The same HARD/SOFT gate and `allowInvalid` waiver as create; answers the fresh version (the findings are the product of the save).
      parameters:
        - $ref: '#/components/parameters/AllowInvalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionContentRequest'
      responses:
        '200':
          description: The updated version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}/transition:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [contract-versions]
      operationId: transitionContractVersion
      summary: Move the version along its lifecycle
      description: |
        Writers only. DRAFT → PROPOSED, PROPOSED → DRAFT | ACTIVE, ACTIVE → DEPRECATED,
        DEPRECATED → RETIRED; anything else is `409`. Several ACTIVE versions may coexist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: The version after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/contracts/{id}/versions/{vid}/recheck:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [contract-versions]
      operationId: recheckContractVersion
      summary: Re-run the checks on the stored document
      description: Writers only — the recovery after a checker outage (`checkComplete = false`). Stores the fresh report; the text is untouched.
      responses:
        '200':
          description: The version with the fresh report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400.
      schema: { type: integer, format: int32, minimum: 0 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
    VersionId:
      name: vid
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 0 }
    AllowInvalid:
      name: allowInvalid
      in: query
      required: false
      schema: { type: boolean }
      description: Store despite SOFT `ERROR` findings (the Save-anyway waiver). HARD findings are never waivable.
    ContractDomainId:
      name: domainId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
    ContractSystemId:
      name: systemId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
    ContractOwnerTeamId:
      name: ownerTeamId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
    ContractOwnerUserId:
      name: ownerUserId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
    ContractType:
      name: type
      in: query
      required: false
      description: Repeatable — any-of over the contract types.
      schema:
        type: array
        items: { $ref: '#/components/schemas/ContractType' }
      style: form
      explode: true
    ContractLifecycle:
      name: lifecycle
      in: query
      required: false
      description: Repeatable — any-of over lifecycles (the LATEST version's on the contracts list/tree).
      schema:
        type: array
        items: { $ref: '#/components/schemas/Lifecycle' }
      style: form
      explode: true
    ContractQuery:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: Case- and accent-insensitive substring over name OR description.
    ContractHasErrors:
      name: hasErrors
      in: query
      required: false
      schema: { type: boolean }
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail) or, on
        /login, the per-account lockout is active (account-specific detail). Both carry a
        ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling — a memory-DoS backstop shared by
        every endpoint (declared here on the largest-bodied operation; field-level maxLength
        rules reject oversized values far earlier on ordinary payloads).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadGateway:
      description: >-
        The upstream request made on the caller's behalf failed (the remote answered non-200,
        redirected, timed out, or exceeded the size cap).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V18) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        memberIds:
          type: array
          maxItems: 200
          items: { type: integer, format: int32, minimum: 0 }
          description: Optional initial roster — every id must be an active user.
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
    TeamMemberResponse:
      type: object
      required: [userId, name, email, deleted]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        deleted:
          type: boolean
          description: The user was soft-deleted after joining; the row stays for the record.
    TeamResponse:
      type: object
      required: [id, name, members, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberResponse'
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, memberCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        memberCount:
          type: integer
          minimum: 0
          description: Active members only.
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DomainRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
    DomainResponse:
      type: object
      required: [id, name, systemCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        systemCount:
          type: integer
          minimum: 0
          description: Active systems inside the domain.
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    DomainPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DomainResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    SystemRequest:
      type: object
      required: [domainId, name]
      properties:
        domainId: { type: integer, format: int32, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
    SystemResponse:
      type: object
      required: [id, domainId, domainName, name, contractCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        domainId: { type: integer, format: int32, minimum: 0 }
        domainName: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        contractCount:
          type: integer
          minimum: 0
          description: Active contracts inside the system (0 until the contracts feature lands).
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    SystemPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SystemResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }

    ContractType:
      type: string
      enum: [OPENAPI, ASYNCAPI, ODCS]
    Lifecycle:
      type: string
      enum: [DRAFT, PROPOSED, ACTIVE, DEPRECATED, RETIRED]
    DocumentFormat:
      type: string
      enum: [yaml, json]
    OwnerKind:
      type: string
      enum: [TEAM, USER]
    OwnerRef:
      type: object
      required: [kind, id, name, deleted]
      properties:
        kind: { $ref: '#/components/schemas/OwnerKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        deleted: { type: boolean }
    RefSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
    LatestVersionSummary:
      type: object
      required: [id, version, lifecycle, checkErrors, checkWarnings, checkComplete]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        version: { type: string }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        checkErrors: { type: integer, minimum: 0 }
        checkWarnings: { type: integer, minimum: 0 }
        checkComplete: { type: boolean }
    ContractCreateRequest:
      type: object
      required: [systemId, type, name]
      properties:
        systemId: { type: integer, format: int32, minimum: 0 }
        type: { $ref: '#/components/schemas/ContractType' }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
        ownerTeamId: { type: integer, format: int32, minimum: 0, nullable: true }
        ownerUserId: { type: integer, format: int32, minimum: 0, nullable: true }
    ContractUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
    OwnerUpdateRequest:
      type: object
      properties:
        ownerTeamId: { type: integer, format: int32, minimum: 0, nullable: true }
        ownerUserId: { type: integer, format: int32, minimum: 0, nullable: true }
    ContractResponse:
      type: object
      required: [id, system, domain, type, name, owner, versionCount, canWrite, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        system: { $ref: '#/components/schemas/RefSummary' }
        domain: { $ref: '#/components/schemas/RefSummary' }
        type: { $ref: '#/components/schemas/ContractType' }
        name: { type: string }
        description: { type: string, nullable: true }
        owner: { $ref: '#/components/schemas/OwnerRef' }
        latestVersion:
          allOf: [{ $ref: '#/components/schemas/LatestVersionSummary' }]
          nullable: true
        versionCount: { type: integer, minimum: 0 }
        canWrite:
          type: boolean
          description: The writer rule for the caller — server-computed, never reimplemented client-side.
        createdBy: { type: integer, format: int32, minimum: 0 }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    ContractPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    TreeContract:
      type: object
      required: [id, name, type, owner, versionCount, canWrite]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        type: { $ref: '#/components/schemas/ContractType' }
        owner: { $ref: '#/components/schemas/OwnerRef' }
        latestVersion:
          allOf: [{ $ref: '#/components/schemas/LatestVersionSummary' }]
          nullable: true
        versionCount: { type: integer, minimum: 0 }
        canWrite: { type: boolean }
    TreeSystem:
      type: object
      required: [id, name, contracts]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        contracts:
          type: array
          items: { $ref: '#/components/schemas/TreeContract' }
    TreeDomain:
      type: object
      required: [id, name, systems]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        systems:
          type: array
          items: { $ref: '#/components/schemas/TreeSystem' }
    TreeResponse:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items: { $ref: '#/components/schemas/TreeDomain' }
    ExportedVersion:
      type: object
      required: [version, lifecycle, format, content]
      properties:
        version: { type: string }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        content: { type: string }
    ContractExportResponse:
      type: object
      required: [contract, versions]
      properties:
        contract: { $ref: '#/components/schemas/ContractResponse' }
        versions:
          type: array
          items: { $ref: '#/components/schemas/ExportedVersion' }
    ContractEventType:
      type: string
      enum: [CREATED, UPDATED, OWNER_CHANGED, DELETED, VERSION_CREATED, VERSION_CONTENT_UPDATED, VERSION_TRANSITIONED, VERSION_DELETED, VERSION_RECHECKED, IMPORTED]
    ContractEventResponse:
      type: object
      required: [id, contractId, userId, userName, timestamp, type, params]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        contractId: { type: integer, format: int32, minimum: 0 }
        userId: { type: integer, format: int32, minimum: 0 }
        userName: { type: string }
        timestamp: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/ContractEventType' }
        params:
          type: object
          additionalProperties: { type: string }
    ContractEventPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractEventResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    Severity:
      type: string
      enum: [ERROR, WARN, INFO]
    FindingSource:
      type: string
      enum: [SYNTAX, SCHEMA, SEMANTIC, LINT, BREAKING, SYSTEM]
    Finding:
      type: object
      required: [severity, source, code, message]
      properties:
        severity: { $ref: '#/components/schemas/Severity' }
        source: { $ref: '#/components/schemas/FindingSource' }
        code: { type: string }
        message: { type: string }
        path: { type: string, nullable: true, description: A JSON pointer into the document. }
        line: { type: integer, minimum: 1, nullable: true }
        column: { type: integer, minimum: 1, nullable: true }
    CheckReport:
      type: object
      required: [findings, errors, warnings, infos, checkerAvailable]
      properties:
        format:
          allOf: [{ $ref: '#/components/schemas/DocumentFormat' }]
          nullable: true
        specVersion: { type: string, nullable: true }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        declaredVersion:
          type: string
          nullable: true
          description: The version the document itself claims (`info.version`, ODCS `version`) — the import form's prefill.
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        errors: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        infos: { type: integer, minimum: 0 }
        checkerAvailable:
          type: boolean
          description: False when the checker sidecar could not be reached — its LINT/SEMANTIC verdicts are missing.
        baselineVersion:
          type: string
          nullable: true
          description: The ACTIVE version the document was compared against for breaking changes; null when none applied.
    DocumentCheckRequest:
      type: object
      required: [type, content]
      properties:
        type: { $ref: '#/components/schemas/ContractType' }
        content: { type: string }
        version: { type: string, nullable: true, description: The SemVer the document is (to be) stored as — drives the version cross-check. }
        contractId:
          type: integer
          minimum: 0
          nullable: true
          description: The contract the document belongs to — its highest ACTIVE version below `version` becomes the breaking-change baseline.
    VersionCreateRequest:
      type: object
      required: [version, content]
      properties:
        version: { type: string, minLength: 5, maxLength: 64, description: SemVer 2.0 }
        content: { type: string, description: "Raw YAML or JSON text, at most 2 MiB." }
    VersionContentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
    TransitionRequest:
      type: object
      required: [to]
      properties:
        to: { $ref: '#/components/schemas/Lifecycle' }
    VersionResponse:
      type: object
      required: [id, contractId, version, lifecycle, format, content, contentSha256, findings, checkErrors, checkWarnings, checkInfos, checkComplete, checkedAt, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        contractId: { type: integer, format: int32, minimum: 0 }
        version: { type: string }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        content: { type: string }
        contentSha256: { type: string }
        docTitle: { type: string, nullable: true }
        docDescription: { type: string, nullable: true }
        specVersion: { type: string, nullable: true }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        checkErrors: { type: integer, minimum: 0 }
        checkWarnings: { type: integer, minimum: 0 }
        checkInfos: { type: integer, minimum: 0 }
        checkComplete: { type: boolean }
        checkedAt: { type: integer, format: int64 }
        createdBy: { type: integer, format: int32, minimum: 0 }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    VersionListItem:
      type: object
      required: [id, contractId, version, lifecycle, format, checkErrors, checkWarnings, checkInfos, checkComplete, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        contractId: { type: integer, format: int32, minimum: 0 }
        version: { type: string }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        docTitle: { type: string, nullable: true }
        specVersion: { type: string, nullable: true }
        checkErrors: { type: integer, minimum: 0 }
        checkWarnings: { type: integer, minimum: 0 }
        checkInfos: { type: integer, minimum: 0 }
        checkComplete: { type: boolean }
        createdBy: { type: integer, format: int32, minimum: 0 }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    VersionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VersionListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    ImportItem:
      type: object
      required: [systemId, type, name, version, content]
      properties:
        systemId: { type: integer, format: int32, minimum: 0 }
        type: { $ref: '#/components/schemas/ContractType' }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
        ownerTeamId: { type: integer, format: int32, minimum: 0, nullable: true }
        ownerUserId: { type: integer, format: int32, minimum: 0, nullable: true }
        version: { type: string }
        content: { type: string }
    ImportRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ImportItem' }
    ImportStatus:
      type: string
      enum: [CREATED, CREATED_WITH_FINDINGS, VERSION_ADDED, VERSION_ADDED_WITH_FINDINGS, INVALID, CONFLICT, FORBIDDEN, ERROR]
    ImportItemResult:
      type: object
      required: [index, name, version, status, errors, warnings]
      properties:
        index: { type: integer, minimum: 0 }
        name: { type: string }
        version: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
        contractId: { type: integer, format: int32, minimum: 0, nullable: true }
        versionId: { type: integer, format: int32, minimum: 0, nullable: true }
        message: { type: string, nullable: true }
        errors: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
    ImportResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ImportItemResult' }
    FetchUrlRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: An absolute https URL of a public host. }
    FetchUrlResponse:
      type: object
      required: [content]
      properties:
        content: { type: string }

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
