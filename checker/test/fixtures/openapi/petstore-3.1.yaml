openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
  description: A minimal, lint-clean OpenAPI 3.1 document.
  contact:
    name: Platform team
servers:
  - url: https://api.example.com/v1
tags:
  - name: pets
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      description: Returns every pet.
      tags: [pets]
      responses:
        "200":
          description: The pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
