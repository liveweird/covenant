asyncapi: 3.0.0
info:
  title: Sample Avro order events
  version: 1.1.0
channels:
  orders:
    address: sample.orders
    messages:
      orderPlaced:
        $ref: '#/components/messages/orderPlaced'
operations:
  receiveOrder:
    action: receive
    channel:
      $ref: '#/channels/orders'
components:
  messages:
    orderPlaced:
      name: OrderPlaced
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          type: record
          name: OrderPlaced
          namespace: example.orders
          fields:
            - name: orderId
              type: string
            - name: amount
              type: long
            - name: note
              type: ['null', string]
              default: null
