[versions]
angus-mail = "2.0.5"
bcrypt = "0.10.2"
# detekt 1.23.x embeds a pre-2.x Kotlin compiler — fine for the plain rule sets we run
# (no type resolution); revisit the detekt 2.x line once it has a stable release.
detekt = "1.23.8"
# Exposed 1.4.0 stalled R2DBC work under full-suite load in Lettuce. The 1.5.0 retry
# passed the full Docker-backed suite twice on 2026-09-20 (including the R2DBC
# concurrency regressions); keep future upgrades gated on the same forced full-suite run.
# 1.6.0 (2026-10-25) cleared that gate: two forced `:server:test --rerun-tasks` runs, 560 tests
# green each time with identical per-test outcomes. It also carries the 1.5.1 fix for
# CVE-2026-108474, SQL injection through the string arguments of locate/concat/groupConcat/match
# and the JSON extract/exists/contains — Covenant calls NONE of those (there is no Exposed json
# import; the `exists(` call sites are the subquery operator and `contains(` is Kotlin stdlib), so
# that fix's behaviour change — a client-escaped value now reaching the database with its escaping
# intact — has no subject here. Re-check that list before adding a SQL-function call site.
exposed = "1.6.0"
flyway = "13.11.1"
kotlin = "2.4.21"
kover = "0.9.11"
logback = "1.6.5"
opentelemetry = "1.67.0"
# Netty alignment (2026-09-04, Lettuce): Ktor's engine ships Netty 4.2 while r2dbc-postgresql 1.1.2
# asks for reactor-netty 1.1.22 (built on 4.1.112) — Gradle lifted the shared modules to 4.2 and left
# the six DNS/proxy modules only reactor-netty uses at 4.1, a mixed classpath under the driver's
# hostname resolution. reactor-netty 1.3.x is built on Netty 4.2 (each release's exact version is
# in its own published pom), and the BOM pins EVERY io.netty module to one version, Ktor's included.
# Keep the two in step: `:server:checkDependencyAlignment` fails both on a mixed io.netty family and
# on a SINGLE version that reactor-netty was not built on. 2026-10-25: 4.2.19.Final is reactor-netty
# 1.3.8's declared Netty, so it moves together with reactor-bom 2025.0.8 below — netty-bom on its
# own (Dependabot #89) stayed held for a week until that upstream pairing shipped.
netty = "4.2.19.Final"
# The SDK line and the instrumentation line MUST pair (instrumentation BOM 2.33.x -> SDK 1.67.0 —
# read the SDK version off the instrumentation BOM's pom before bumping either; opentelemetry-ktor-3.0
# 2.33.0-alpha declares opentelemetry-api 1.67.0). The alpha BOM imported in core pins every
# io.opentelemetry artifact, incubator/alpha ones included, to that pair;
# `:server:checkDependencyAlignment` fails on drift.
opentelemetry-ktor = "2.33.0-alpha"
# Stable semconv, held deliberately apart from the instrumentation BOM's incubating pin: 2.33.0-alpha
# pins semconv-incubating 1.44.0-alpha, the same series, so this stays put across the SDK bump.
opentelemetry-semconv = "1.44.0"
r2dbc-pool = "1.0.2.RELEASE"
# The Reactor BOM pairs core, pool and Netty versions; the alignment gate checks its constraints.
# 2025.0.8 pairs reactor-core 3.8.8 / reactor-netty 1.3.8 / reactor-pool 1.2.8, and reactor-netty
# 1.3.8's pom declares Netty 4.2.19.Final — the reason `netty` above moves in the same commit.
reactor-bom = "2025.0.8"
r2dbc-postgresql = "1.1.3.RELEASE"
swagger-request-validator = "3.0.0"
testcontainers = "2.0.5"
# The try-it Kafka leg (contracts/tryit/KafkaTry.kt): the KRaft-era client — no Jackson, Netty or
# OpenTelemetry on its transitive set (only slf4j + the zstd/lz4/snappy codecs, KEPT so a read of a
# compressed topic decompresses); checkDependencyAlignment logs the runtime classpath after a bump.
kafka-clients = "4.4.0"
# Runtime security floors (Trivy scans, 2026-09-24 and 2026-10-14). These remain transitive implementation
# details of r2dbc-postgresql, Kafka and openapi-diff; server constraints select the first fixed
# releases without forcing coordinated upgrades of those direct dependencies.
scram = "3.4"
lz4-java = "1.12.0"
commons-configuration = "2.15.1"

# Contract validation: these libraries build against Jackson 2.22.2. The 2026-10-14
# security patch pins the family to 2.22.3 for parser/databind DoS fixes (2.22.4 since 2026-10-25);
# the BOM and alignment gate guard the family. networknt stays on the 2.0.x line on purpose: 3.x
# moved to Jackson 3 (tools.jackson), whose JsonNode is a different type from swagger-parser's and
# Avro's Jackson 2 trees. Correction (2026-10-25): an earlier version of this note said Flyway 13
# rides Jackson 3 alongside Jackson 2 and that checkDependencyAlignment logs it. It does not —
# flyway-core declares tools.jackson.core:jackson-databind `optional=true`, so Gradle never resolves
# it transitively and `tools.jackson` appears in NO lockfile. The gate's tools.jackson branch has
# therefore never fired; keep it as the tripwire for the day Flyway makes that dependency mandatory.
avro = "1.12.2"
jackson = "2.22.4"
json-schema-validator = "2.0.7"
# swagger-parser-v3 only (OpenAPI 3.x): the `swagger-parser` aggregator drags in the Swagger 2.0
# converter, and Covenant rejects Swagger 2.0 documents at the type gate.
swagger-parser = "2.1.48"
# openapi-diff-core compares two parsed OpenAPI trees (milestone 2's BREAKING findings). Covenant
# calls `OpenApiDiff.compare(OpenAPI, OpenAPI, options)` directly — never `OpenApiCompare`, whose
# static init constructs the `swagger-parser` AGGREGATOR (Swagger 2.0 converter and all), which is
# excluded along with the j2html renderer in server/build.gradle.kts.
openapi-diff = "2.1.7"

[libraries]
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
swagger-parser-v3 = { module = "io.swagger.parser.v3:swagger-parser-v3", version.ref = "swagger-parser" }
openapi-diff-core = { module = "org.openapitools.openapidiff:openapi-diff-core", version.ref = "openapi-diff" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angus-mail" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc", version.ref = "exposed" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
opentelemetry-exporterLogging = { module = "io.opentelemetry:opentelemetry-exporter-logging", version.ref = "opentelemetry" }
opentelemetry-exporterOtlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-instrumentationBomAlpha = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha", version.ref = "opentelemetry-ktor" }
opentelemetry-logbackAppender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-ktor" }
opentelemetry-ktorInstrumentation = { module = "io.opentelemetry.instrumentation:opentelemetry-ktor-3.0", version.ref = "opentelemetry-ktor" }
opentelemetry-sdkAutoconfigure = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure", version.ref = "opentelemetry" }
opentelemetry-semconv = { module = "io.opentelemetry.semconv:opentelemetry-semconv", version.ref = "opentelemetry-semconv" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.14" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbc-postgresql" }
reactor-netty-core = { module = "io.projectreactor.netty:reactor-netty-core" }
r2dbc-pool = { module = "io.r2dbc:r2dbc-pool", version.ref = "r2dbc-pool" }
reactor-bom = { module = "io.projectreactor:reactor-bom", version.ref = "reactor-bom" }
reactor-pool = { module = "io.projectreactor.addons:reactor-pool" }
swagger-request-validator-core = { module = "com.atlassian.oai:openapi-request-validator-core", version.ref = "swagger-request-validator" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka-clients" }
scram-client = { module = "com.ongres.scram:scram-client", version.ref = "scram" }
scram-common = { module = "com.ongres.scram:scram-common", version.ref = "scram" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4-java" }
commons-configuration = { module = "org.apache.commons:commons-configuration2", version.ref = "commons-configuration" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
