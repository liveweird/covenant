# Weekly dependency bumps, grouped so one PR per workspace per week carries the minor/patch set
# and majors arrive alone (a major deserves its own review — see the pin rationales in
# gradle/libs.versions.toml and the version notes in .claude/docs/checker.md).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # The Ktor catalog is declared in settings.gradle.kts and pinned independently in
    # settings-gradle.lockfile. Dependabot may refresh project locks without refreshing that
    # settings lock, so catalog bumps need the full documented --write-locks command before CI.
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
        # These families carry compatibility pins; review their updates independently.
        exclude-patterns: ["io.opentelemetry:*", "io.opentelemetry.instrumentation:*", "io.netty:*", "io.projectreactor*:*", "org.jetbrains.exposed:*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["vitest", "@vitest/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
    # TypeScript majors are a coordinated web/checker/E2E migration. In web, openapi-typescript
    # still relies on compiler APIs and declares a TypeScript 5 peer (TS 6 is the reviewed
    # --legacy-peer-deps exception).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /checker
    schedule:
      interval: weekly
    groups:
      checker-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["vitest", "@vitest/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # External image tags and digests are reviewed just like application dependencies.
  - package-ecosystem: docker
    directories: ["/", "/checker", "/k8s"]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
