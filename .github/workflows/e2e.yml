name: e2e

# Blackbox Playwright suite: brings the full stack up via docker compose and drives a real browser.
on:
  # Not on push/PR: the compose stack + Playwright on a runner takes ~10+ minutes — ci.yml
  # (server/web/checker/e2e-static gates) is the PR gate. The suite runs NIGHTLY against main so a
  # UI regression is caught within a day, and on demand from the Actions tab → "e2e" → "Run workflow".
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
        env:
          # The checker image builds inside compose; Spectral's @scarf/scarf postinstall phones home.
          SCARF_ANALYTICS: "false"

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # global-setup runs `docker compose up -d --build` on the runner and waits for :8082.
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
