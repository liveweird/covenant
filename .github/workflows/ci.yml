name: ci

# The push/PR gate — every local gate (CLAUDE.md "Commands") re-run on a clean runner:
# server (detekt + Testcontainers tests + Kover + OpenAPI coverage + dependency alignment), web
# (the spec → schema.ts drift check, lint, knip, tests with coverage floors, build), checker (lint,
# knip, typecheck, tests, build), and the Docker-free e2e statics (lint, knip, typecheck, spec↔scenario
# parity). The blackbox Playwright suite runs nightly and on demand (e2e.yml).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Spectral's @scarf/scarf postinstall phones home on install; opt every job out.
  SCARF_ANALYTICS: "false"

jobs:
  samples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s samples/contracts -p 'test*.py'

  server:
    # ubuntu-24.04 ships a Docker daemon — Testcontainers starts the pinned PostgreSQL 18 image on it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # `build` = compile + detekt + test + koverVerify + checkDependencyAlignment (`check`).
      - run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: server-reports
          path: server/build/reports/
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # --legacy-peer-deps per web/README.md (openapi-typescript declares TS ^5, the repo uses TS 6).
      - run: npm ci --legacy-peer-deps
      # The same-commit rule made mechanical: a spec change must land with its regenerated
      # src/api/schema.ts, or the SPA type-checks against a stale client surface.
      - name: OpenAPI → schema.ts drift
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts \
            || { echo "::error::web/src/api/schema.ts is stale — run 'cd web && npm run gen:api' and commit the result"; exit 1; }
      - run: npm run lint
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run build
        env:
          # The runner's checkout is a detached HEAD; stamp the build from the event instead of
          # the vite config's `git status` dirty check (see web/CLAUDE.md "Build version stamp").
          GIT_SHA: ${{ github.sha }}

  checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: checker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: checker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e-static:
    # The Docker-free e2e gates: eslint+sonarjs and knip (the web/checker siblings), typecheck
    # (Playwright only TRANSPILES TS), and spec↔scenario parity — the same-commit rule made
    # mechanical (e2e/README.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npm run typecheck
      - run: npm run check:scenarios
      - run: npm run test:setup

  images:
    # Dockerfile drift guard on the default branch: both images must still build. Push-only —
    # the two multi-stage builds are the slowest job here.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The SPA build stage reads the commit sha and time from .git.
          fetch-depth: 0
      - run: docker compose build
